<!DOCTYPE html>
<html>
<head>
    <title>Registration Preview</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; }
        input[type="text"], input[type="email"], input[type="number"], select { width: 300px; padding: 5px; margin-top: 5px; }
        button { padding: 10px 15px; margin-right: 10px; cursor: pointer; }
        #error-message { color: red; font-weight: bold; margin-bottom: 15px; }
        #preview-card { margin-top: 30px; padding: 20px; width: 350px; border: 2px solid black; display: none; }
    </style>
</head>
<body>

    <h2>Student Registration Form</h2>
    
    <div id="error-message"></div>

    <div class="form-group">
        <label>Student Name:</label><br>
        <input type="text" id="student-name">
    </div>
    
    <div class="form-group">
        <label>Student ID:</label><br>
        <input type="text" id="student-id">
    </div>

    <div class="form-group">
        <label>Email:</label><br>
        <input type="email" id="student-email">
    </div>

    <div class="form-group">
        <label>Department:</label><br>
        <select id="student-dept">
            <option value="Computer Science">Computer Science</option>
            <option value="Business">Business</option>
            <option value="Engineering">Engineering</option>
        </select>
    </div>

    <div class="form-group">
        <label>Semester:</label><br>
        <input type="number" id="student-semester" min="0" max="8">
    </div>

    <div class="form-group">
        <label>Gender:</label><br>
        <input type="radio" name="gender" value="Male" id="gender-male" checked> Male
        <input type="radio" name="gender" value="Female" id="gender-female"> Female
    </div>
    
    <button onclick="generatePreview()">Generate Preview</button>
    <button onclick="clearForm()">Clear Form</button>
    
    <div id="preview-card">
        <h2>Student Registration Preview</h2>
        <p><b>Name:</b> <span id="out-name"></span></p>
        <p><b>ID:</b> <span id="out-id"></span></p>
        <p><b>Email:</b> <span id="out-email"></span></p>
        <p><b>Department:</b> <span id="out-dept"></span></p>
        <p><b>Semester:</b> <span id="out-semester"></span></p>
        <p><b>Gender:</b> <span id="out-gender"></span></p>
    </div>

    <script>
        function generatePreview() {
            var nameVal = document.getElementById("student-name").value;
            var idVal = document.getElementById("student-id").value;
            var emailVal = document.getElementById("student-email").value;
            var deptVal = document.getElementById("student-dept").value;
            var semVal = document.getElementById("student-semester").value;
            
            var genderVal = "Male";
            if (document.getElementById("gender-female").checked) {
                genderVal = "Female";
            }

            if (nameVal === "" || idVal === "") {
                document.getElementById("error-message").innerHTML = "Error: Name and ID cannot be empty!";
                document.getElementById("preview-card").style.display = "none";
                return;
            }

            document.getElementById("error-message").innerHTML = "";

            document.getElementById("out-name").innerHTML = nameVal;
            document.getElementById("out-id").innerHTML = idVal;
            document.getElementById("out-email").innerHTML = emailVal;
            document.getElementById("out-dept").innerHTML = deptVal;
            document.getElementById("out-semester").innerHTML = semVal;
            document.getElementById("out-gender").innerHTML = genderVal;

            document.getElementById("preview-card").style.backgroundColor = "lightcyan";
            document.getElementById("preview-card").style.display = "block";
        }

        function clearForm() {
            document.getElementById("student-name").value = "";
            document.getElementById("student-id").value = "";
            document.getElementById("student-email").value = "";
            document.getElementById("student-dept").value = "Computer Science";
            document.getElementById("student-semester").value = "";
            document.getElementById("gender-male").checked = true;

            document.getElementById("preview-card").style.display = "none";
            document.getElementById("error-message").innerHTML = "";
        }
    </script>

</body>
</html>
