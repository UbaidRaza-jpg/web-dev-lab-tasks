<!DOCTYPE html>
<html>
<head>
    <title>Student Profile</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .input-group { margin-bottom: 10px; }
        input[type="text"] { width: 300px; padding: 8px; margin-top: 5px; }
        button { background-color: darkblue; color: white; padding: 10px 15px; border: none; cursor: pointer; margin-top: 10px; }
        #profile-card { background-color: lightblue; padding: 20px; width: 300px; margin-top: 20px; display: none; }
    </style>
</head>
<body>

    <h2>Student Profile</h2>
    
    <div class="input-group">
        <label>Student Name:</label><br>
        <input type="text" id="name-input">
    </div>
    
    <div class="input-group">
        <label>Department:</label><br>
        <input type="text" id="dept-input">
    </div>
    
    <button onclick="generateProfile()">Generate Profile</button>
    
    <div id="profile-card">
        <h3>Student Information</h3>
        <p><b>Name:</b> <span id="display-name"></span></p>
        <p><b>Department:</b> <span id="display-dept"></span></p>
    </div>

    <script>
        function generateProfile() {
            var studentName = document.getElementById("name-input").value;
            var department = document.getElementById("dept-input").value;
            
            document.getElementById("display-name").innerHTML = studentName;
            document.getElementById("display-dept").innerHTML = department;
            
            document.getElementById("profile-card").style.display = "block";
        }
    </script>

</body>
</html>
